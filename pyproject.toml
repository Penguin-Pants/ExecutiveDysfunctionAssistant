[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "interview-prep-recall"
version = "0.1.0"
description = "Always-on-top interview prep recall overlay for Windows"
requires-python = ">=3.11"

# Runtime dependencies are declared but deliberately NOT all installed in the
# Linux dev container. See docs/implementation/06-progress.md "Environment split".
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
# Qt. **Not** Windows-only — this was listed under `windows` with the note that it
# "cannot be installed or exercised on the Linux dev box", and both halves were false:
# PySide6 has Linux wheels and runs under QT_QPA_PLATFORM=offscreen, which is how the
# T9.1 dialog tests run in CI and in the dev container. What genuinely needs Windows is
# SetWindowDisplayAffinity (T5.2) — an API call, not a toolkit.
ui = [
    "PySide6>=6.6",
]
# Genuinely Windows-only runtime: WASAPI loopback, DPAPI-backed credential storage.
windows = [
    "pyaudiowpatch>=0.2.12",
    "faster-whisper>=1.0",
    "soxr>=0.3.7",
    "keyring>=24",
]
# Heavy ML stack. Pulled in for real embedding runs; unit tests use a fake
# embedder against the same Protocol, so CI does not need torch.
embeddings = [
    "sentence-transformers>=2.6",
]
cloud = [
    "anthropic>=0.39",
    "websockets>=14",
    "httpx>=0.27",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "mypy>=1.10",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
include = ["interview_prep_recall*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "device: requires real audio hardware; runs only on the Windows target machine",
    "windows: requires Windows APIs; runs only on the Windows target machine",
    "slow: soak and long-running tests; nightly only",
]
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Specs are prose; formatting their fenced code blocks creates diff churn.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
# The shipping target is 3.12 (design §10), so type-check for 3.12 even though the
# Linux dev container runs 3.11. Pinning this to 3.11 made mypy fail to parse numpy's
# own stubs on CI, which use `type` statements: analysing for an older version than
# the dependencies are written for is not a safer choice, just a broken one.
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true

# The STT interface is the one module T0.2 requires to pass --strict.
[[tool.mypy.overrides]]
module = "interview_prep_recall.stt.interface"
strict = true

# Windows-only modules whose type-checking result differs *by platform*.
# `ctypes.windll` does not exist off Windows, so these need `type: ignore[attr-defined]`
# for mypy in the Linux dev container — and CI runs mypy on Windows, where the same
# ignores are unused and `warn_unused_ignores` turns them into errors. There is no single
# annotation that satisfies both, so unused-ignore warnings are disabled here and only
# here. Same class of divergence as the `websockets` extra: the dev container is not the
# CI environment, in the opposite direction this time.
[[tool.mypy.overrides]]
module = [
    "interview_prep_recall.platform.win_dpapi",
    "interview_prep_recall.platform.win_wer",
    "interview_prep_recall.platform.win_capture_exclusion",
]
warn_unused_ignores = false

# Optional third-party packages CI does not install, or that ship no stubs.
# `websockets` lives in the [cloud] extra and is imported lazily inside the connector
# factories, so the backends type-check and run without it — but mypy still resolves the
# import and fails the run. Same category as the Windows-only packages below.
[[tool.mypy.overrides]]
module = [
    "keyring",
    "keyring.*",
    "soxr",
    "pyaudiowpatch",
    "faster_whisper",
    "sentence_transformers",
    "websockets",
    # Resolved and type-checked when the [ui] extra is installed (CI installs it). Listed
    # so a contributor who installed only [dev] gets a mypy run that fails on real
    # problems rather than on a missing optional dependency.
    "PySide6",
    "PySide6.*",
]
ignore_missing_imports = true
