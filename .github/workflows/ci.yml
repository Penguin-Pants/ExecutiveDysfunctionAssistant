name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    # Windows is the target platform (D-U4), so CI runs there even though the
    # dev container is Linux. Hosted Windows runners have no audio endpoint, so
    # device-marked tests are excluded here and run on the target machine
    # instead — see docs/implementation/03-tasks.md, "CI audio strategy".
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Type check
        # T0.2 requires --strict on the STT interface specifically; the rest of
        # the package is checked at default strictness via pyproject settings.
        run: mypy interview_prep_recall

      - name: Tests
        run: pytest -q -m "not device and not slow"
